version: '3.8'

services:
  # Vector & Relational Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: auditguard_postgres
    environment:
      POSTGRES_USER: audit_admin
      POSTGRES_PASSWORD: audit_password
      POSTGRES_DB: auditguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Fast Semantic Cache & Agent State
  redis:
    image: redis:7-alpine
    container_name: auditguard_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
